[package]
name = "apifuck-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tokio.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream", "gzip", "brotli", "deflate", "socks", "system-proxy"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
rquickjs = "0.11"
regex = "1"
url = "2"
percent-encoding = "2"
base64 = "0.22"
jsonschema = { version = "0.33", default-features = false }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
shell-words = "1"
csv = "1.4"
yaml-edit = "0.3.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
webpki-roots = "1"

semver = "1"
sha2 = "0.10"
cookie_store = { version = "0.22.1", default-features = false, features = ["serde_json"] }
psl = "2"
time = { version = "0.3", features = ["formatting"] }
self-replace = "1"

axum = "0.8"

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
roxmltree = "0.21"

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
self_update = { version = "=1.3.0", default-features = false, features = ["ureq", "rustls", "archive-tar", "compression-tar-gz", "checksums"] }
