info:
  name: SSE · 持续接收事件
  type: http
  seq: 1
  description: 约 3 秒内收到 8 个 progress 事件。可以观察增量响应，或点击 Cancel 提前停止。
http:
  method: GET
  url: "{{base_url}}/events"
  params:
    - name: count
      value: "8"
      type: query
      description: 事件数量
    - name: interval
      value: "400"
      type: query
      description: 事件间隔（ms）
  headers:
    - name: Accept
      value: text/event-stream
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test('HTTP 200', () => expect(res.status).to.equal(200));
        test('SSE events',()=>expect(res.body).to.include('event: progress'));
settings:
  timeout: 0
docs: |
  # SSE · 持续接收事件

  约 3 秒内收到 8 个 progress 事件。可以观察增量响应，或点击 Cancel 提前停止。

  - 环境：local（启动器会自动选择）
  - 目标：本地 ApiFuck Demo API
  - 发送后打开 Tests 查看断言，Headers 查看 X-Trace-Id。
