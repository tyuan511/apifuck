http:
  method: POST
  url: "{{base_url}}/echo"
  body:
    type: form-urlencoded
    data:
      - name: email
        value: "{{email}}"
        description: 环境变量
      - name: display_name
        value: 测试用户
        description: 中文编码
      - name: tag
        value: rust
      - name: tag
        value: api
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test('HTTP 200', () => expect(res.status).to.equal(200));
        test('Form fields',()=>expect(res.body.form).to.have.lengthOf(4));
        test('Form encoding',()=>expect(res.body.form.find(p=>p.name==='display_name').value).to.equal('测试用户'));
