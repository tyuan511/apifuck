info:
  name: 慢响应 · 测试取消
  type: http
  seq: 5
  description: 慢响应 · 测试取消
http:
  method: GET
  url: "{{base_url}}/delay"
  params:
    - name: ms
      value: "3000"
      type: query
      description: 等待 3 秒；可以点击 Cancel
  auth: inherit
runtime:
  scripts:
    - type: tests
      code: |-
        test('HTTP 200', () => expect(res.status).to.equal(200));
        test('Delay',()=>expect(res.body.delayedMs).to.equal(3000));
settings:
  timeout: 10000
docs: |
