[workspace]
members = ["crates/core", "crates/desktop", "crates/demo"]
default-members = ["crates/desktop"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "net", "io-util"] }
apifuck-core = { path = "crates/core" }

[profile.dev]
debug = 0

# Keep the embedded interpreter fast enough for bounded script execution on MSVC.
# The test profile inherits this dependency override from dev.
[profile.dev.package.rquickjs-sys]
opt-level = 2

[profile.release]
strip = true
lto = "thin"
