name: apifuck-website
services:
  website:
    image: ${IMAGE_REGISTRY:-ghcr.io/tyuan511/apifuck/website}:${IMAGE_TAG:?Set IMAGE_TAG to a verified commit SHA}
    ports:
      - "127.0.0.1:9092:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
