name: Website
on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/website.yml"]
  pull_request:
    paths: ["website/**", ".github/workflows/website.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --prefix website
      - run: npm --prefix website run check
      - run: npm --prefix website run build
      - run: npx --prefix website playwright install --with-deps chromium
      - name: Container and browser DOM checks
        run: |
          docker build -t apifuck-website:check website
          docker run -d --name website-check --read-only \
            --tmpfs /var/cache/nginx --tmpfs /var/run --tmpfs /tmp \
            -p 127.0.0.1:9092:8080 apifuck-website:check
          trap 'docker stop website-check' EXIT
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:9092/health.json >/dev/null; then break; fi
            sleep 1
          done
          npm --prefix website run test:browser
  publish:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: website
          file: website/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}/website:${{ github.sha }}
          build-args: SITE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=website
          cache-to: type=gha,scope=website,mode=max
  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copy deployment configuration
        run: |
          set -euo pipefail
          opts=(-i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes)
          ssh "${opts[@]}" root@69.12.84.28 'install -d -m 755 /opt/apifuck-website'
          scp "${opts[@]}" website/deploy/docker-compose.yml website/deploy/deploy.sh root@69.12.84.28:/opt/apifuck-website/
      - name: Pull, deploy and verify the exact revision
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          SITE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          opts=(-i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes)
          # Expand the workflow actor and commit on the runner, not the remote host.
          # shellcheck disable=SC2029
          # shellcheck disable=SC2029 # Expand validated runner values before SSH.
          printf '%s' "$GHCR_TOKEN" | ssh "${opts[@]}" root@69.12.84.28 "docker login ghcr.io -u '$GHCR_USER' --password-stdin"
          # shellcheck disable=SC2029
          # shellcheck disable=SC2029 # Pass this exact commit SHA to the host.
          ssh "${opts[@]}" root@69.12.84.28 "export IMAGE_TAG='$SITE_REVISION'; bash /opt/apifuck-website/deploy.sh"
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            "https://apifuck.fastvibe.dev/health.json?revision=$SITE_REVISION" | \
            jq -e --arg sha "$SITE_REVISION" '.revision == $sha'
